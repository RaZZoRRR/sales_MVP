<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>Продажи</title>
</head>

<body>

    <main class="app">

        <header>

            <div>
                <h1 id="title">Продажи</h1>

                <div
                    id="today"
                    class="muted"
                ></div>
            </div>

            <button id="resetSalesBtn" class="danger-btn">
  Сбросить данные об отчете
</button>
            <button
                id="settingsBtn"
                class="top-btn"
            >
                ⚙
            </button>

        </header>


        <nav class="tabs">

            <button
                class="tab active"
                data-page="salesPage"
            >
                Продажи
            </button>

            <button
                class="tab"
                data-page="settingsPage"
            >
                Настройки
            </button>

        </nav>


        <section id="salesPage">

            <div class="section-title">
                Продажи
            </div>

            <div id="categories"></div>


            <section class="summary">

                <div>
                    <span>Продано</span>
                    <strong id="totalQty">0</strong>
                </div>

                <div>
                    <span>УП</span>
                    <strong id="totalUp">0,00</strong>
                </div>

            </section>


            <section class="report-card">

                <div class="section-title">
                    Отчёт за сегодня
                </div>

                <div id="report"></div>

            </section>

        </section>


        <section
            id="settingsPage"
            class="hidden"
        >

            <div class="section-title">
                Продукты
            </div>


            <form
                id="productForm"
                class="form-card"
            >

                <input
                    type="hidden"
                    id="editId"
                >


                <label>
                    Категория

                    <input
                        id="category"
                        required
                        placeholder="Например: ЮЛ"
                    >
                </label>


                <label>
                    Название

                    <input
                        id="name"
                        required
                        placeholder="Полное название"
                    >
                </label>


                <label>
                    Название в отчёте

                    <input
                        id="shortName"
                        placeholder="Например: ИП с QR"
                    >
                </label>


                <label>
                    Цена, УП

                    <input
                        id="price"
                        type="number"
                        step="0.01"
                        min="0"
                        placeholder="0,00"
                    >
                </label>


                <label>
                    Тип расчёта

                    <select id="rule">

                        <option value="fixed">
                            Фиксированная цена
                        </option>

                        <option value="zls">
                            ЗЛС
                        </option>

                        <option value="health">
                            СберЗдоровье
                        </option>

                        <option value="health_option">
                            Опция СберЗдоровья
                        </option>

                    </select>

                </label>


                <div class="form-actions">

                    <button class="primary">
                        Сохранить
                    </button>

                    <button
                        type="button"
                        id="cancelEdit"
                        class="secondary hidden"
                    >
                        Отмена
                    </button>

                </div>

            </form>


            <div id="productList"></div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>
</html>
