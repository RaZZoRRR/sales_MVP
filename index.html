<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Продажи</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Продажи</h1>
        <div id="today" class="muted"></div>
      </div>
      <button id="refreshBtn" class="icon-btn" title="Обновить">↻</button>
    </header>

    <section id="configWarning" class="warning hidden">
      Supabase ещё не настроен. Сейчас приложение работает в демо-режиме.
    </section>

    <section>
      <div class="section-title">Продажи</div>
      <div id="categories"></div>
    </section>

    <section class="summary">
      <div>
        <span>Продано</span>
        <strong id="totalQty">0</strong>
      </div>
      <div>
        <span>УП</span>
        <strong id="totalUp">0,00</strong>
      </div>
    </section>

    <section class="report-card">
      <div class="section-title">Отчёт за сегодня</div>
      <div id="report"></div>
    </section>
  </main>

  <dialog id="modal">
    <div id="modalContent"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
